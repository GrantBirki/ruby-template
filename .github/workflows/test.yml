name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: openai/fence@63c516e78543f3d8d6088ebad6475a39920863bd # pin@v0.10.2

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # pin@v1.324.0
        with:
          bundler: none
          bundler-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: test
        run: script/test
